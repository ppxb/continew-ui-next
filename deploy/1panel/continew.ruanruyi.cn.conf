server {
    listen 80;
    listen 443 ssl;
    server_name continew.ruanruyi.cn;
    index index.html;
    root /www/sites/continew.ruanruyi.cn/index;
    access_log /www/sites/continew.ruanruyi.cn/log/access.log main;
    error_log /www/sites/continew.ruanruyi.cn/log/error.log;

    ssl_certificate /www/sites/continew.ruanruyi.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/continew.ruanruyi.cn/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    http2 on;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }
    error_page 497 https://$host$request_uri;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    location = /api {
        return 308 /api/;
    }
    location ^~ /api/ {
        proxy_pass https://continew-api.ruanruyi.cn/;
        proxy_set_header Host continew-api.ruanruyi.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name continew-api.ruanruyi.cn;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
